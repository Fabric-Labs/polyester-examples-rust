[package]
name = "polyester-examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Runnable examples for the official Polyester Rust SDK."
license = "MIT OR Apache-2.0"

[dependencies]
polyester-sdk = { path = "../polyester-sdk-rust", version = "0.1.0-alpha.28", features = ["realtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
anyhow = "1"
alloy-primitives = "1"

[[example]]
name = "01_public_market_data"
path = "examples/01_public_market_data.rs"

